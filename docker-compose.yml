services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api1
      - api2
      - api3

  api1:
    image: ${DOCKERHUB_USERNAME}/${IMAGE}:latest
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 5000
      INSTANCE_ID: api1

  api2:
    image: ${DOCKERHUB_USERNAME}/${IMAGE}:latest
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 5000
      INSTANCE_ID: api2

  api3:
    image: ${DOCKERHUB_USERNAME}/${IMAGE}:latest
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 5000
      INSTANCE_ID: api3