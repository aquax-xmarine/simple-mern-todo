name: Backend CI/CD

on:
  push:
    branches: [master]
    paths: ['backend/**']

jobs: 
  build-and-push:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Bild and push
        run: bash scripts/build-and-push.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: simple-mern-todo-backend
          CONTEXT: ./backend
      
      # - name: Log in to Docker Hub
      #   run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # - name: Build the image
      #   run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/simple-mern-todo-backend:latest ./backend

      # - name: Push the image
      #   run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/simple-mern-todo-backend:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        run: bash scripts/deploy.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          IMAGE: simple-mern-todo-backend
          CONTAINER: simple-mern-todo-backend
          PORT: 5000
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}